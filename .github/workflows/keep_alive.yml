name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows manual triggers

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Streamlit
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://your-app.streamlit.app
